name: Build, migrate and deploy ASP.NET Core app

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore PropertyDemo.csproj

      - name: Build application
        run: dotnet build PropertyDemo.csproj --configuration Release --no-restore

      - name: Publish application
        run: dotnet publish PropertyDemo.csproj --configuration Release --no-build -o "${{ runner.temp }}/myapp"

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{ runner.temp }}/myapp

  migrate-database:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore PropertyDemo.csproj

      - name: Install EF Core CLI
        run: |
          dotnet tool install --global dotnet-ef --version '10.*'
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Apply pending database migrations
        env:
          ConnectionStrings__DefaultConnection: ${{ secrets.AZURE_SQL_CONNECTION_STRING }}
        run: dotnet ef database update --project PropertyDemo.csproj

  deploy:
    runs-on: ubuntu-latest
    needs: migrate-database
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: .net-app
          path: ./publish

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_3CFEB8979745475DA742DE38B272D7B2 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_530CC0A625744433B2B9A7C1F6F5ED72 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_C4E3B41D92634AE7898B8CA00487563B }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'app-propertydemo-dev-001'
          slot-name: 'Production'
          package: ./publish

